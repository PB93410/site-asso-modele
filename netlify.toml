# Netlify — site de l’association
# Optimisé : cache long assets hashés, HTML revalidé, Functions légères
# MAJ-33 : Production = full build + prerender Puppeteer (SEO)
# LOT-2 : redirections API bureau versionnées, no-store + noindex /bureau

[build]
  # build:fast = sans prerender (local Windows + previews)
  command = "npm run build:fast"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Mémoire Node pour Vite + Puppeteer
  NODE_OPTIONS = "--max-old-space-size=4096"
  PUPPETEER_SKIP_DOWNLOAD = "false"
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"
  # CI : pas de téléchargement inutile
  NPM_FLAGS = "--no-audit --no-fund"

# ──────────────────────────────────────────────
# Contextes
# ──────────────────────────────────────────────

# Production = full build + prerender (SEO crawlers)
[context.production]
  command = "npm run build"

# Previews et branch deploys restent rapides
[context.deploy-preview]
  command = "npm run build:fast"

[context.branch-deploy]
  command = "npm run build:fast"

# ──────────────────────────────────────────────
# Functions : cold start réduit
# ──────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"
  # Planning et événements de départ du stockage Netlify (onglets jamais écrits).
  included_files = ["public/data/*.csv"]

# Cartes adhérents : recto fabriqué à l’envoi (polices, logo, moteur resvg), verso commun.
[functions.carte-mail]
  included_files = [
    "public/assets/carte-verso-*.png",
    "public/assets/logo-512.png",
    "netlify/cartes/fonts/*.ttf",
    "node_modules/@resvg/resvg-wasm/index_bg.wasm",
  ]

# Sauvegarde Excel envoyée à la boîte de l’asso chaque lundi (planification : config dans le fichier).
[functions.sauvegarde-hebdo]
  included_files = ["public/data/*.csv"]

[functions.carte-image]
  included_files = [
    "public/assets/logo-512.png",
    "netlify/cartes/fonts/*.ttf",
    "node_modules/@resvg/resvg-wasm/index_bg.wasm",
  ]

# Espace adhérent : recto de la carte (comme carte-image) et planning de départ (carte Wallet).
[functions.espace]
  included_files = [
    "public/data/*.csv",
    "public/assets/logo-512.png",
    "netlify/cartes/fonts/*.ttf",
    "node_modules/@resvg/resvg-wasm/index_bg.wasm",
  ]

# ──────────────────────────────────────────────
# Redirects API + SPA bureau
# ──────────────────────────────────────────────

# SPA interne uniquement (pas de HTML prérendu). force=true écrase tout fichier dist.
# Ne jamais copier ce pattern sur une page publique (/tarifs, /essai, /faq…).

# Ancienne page bénévoles → un seul espace bureau
[[redirects]]
  from = "/benevoles"
  to = "/bureau"
  status = 302
  force = true

[[redirects]]
  from = "/benevoles/"
  to = "/bureau"
  status = 302
  force = true

[[redirects]]
  from = "/bureau"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/bureau/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/bureau/*"
  to = "/index.html"
  status = 200
  force = true

# Ne pas réécrire /tarifs vers index.html : dist/tarifs/index.html (prerender) doit être servi.

