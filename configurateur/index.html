<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer le site de votre association</title>
    <meta name="description" content="Décrivez votre association en 20 minutes : nous préparons votre site." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23334155'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <!-- Formulaire repéré par Netlify Forms au déploiement ; l'envoi réel se fait en JavaScript. -->
    <form name="dossier-association" data-netlify="true" netlify-honeypot="adresse-bis" hidden>
      <input name="association" />
      <input name="contact" />
      <input name="email" />
      <input type="file" name="dossier" />
      <input name="adresse-bis" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
