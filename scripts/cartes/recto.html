<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Carte adhérent</title>
  <style>
    @font-face {
      font-family: "Barlow Condensed";
      src: url("__FONT_BARLOW__") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Inter";
      src: url("__FONT_INTER__") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Inter";
      src: url("__FONT_INTER_MED__") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 1011px;
      height: 638px;
      background: transparent;
    }
    .card {
      position: relative;
      width: 1011px;
      height: 638px;
      background: #111110;
      border-radius: 48px;
      overflow: hidden;
      color: #fff;
    }
    .bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 29px;
      height: 500px;
      background: __COULEUR__;
    }
    .rule {
      position: absolute;
      left: 0;
      top: 500px;
      width: 100%;
      height: 7px;
      background: __COULEUR__;
    }
    .foot {
      position: absolute;
      left: 0;
      top: 507px;
      right: 0;
      bottom: 0;
      background: #1A1916;
    }
    .logo {
      position: absolute;
      top: 28px;
      right: 20px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand {
      position: absolute;
      left: 64px;
      top: 50px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 64px;
      line-height: 0.78;
      letter-spacing: 0.01em;
    }
    .brand .gym { color: #fff; }
    .brand .vol { color: __COULEUR__; }
    .sub {
      position: absolute;
      left: 62px;
      top: 116px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.24em;
      color: #B2AEA7;
    }
    .role {
      position: absolute;
      left: 63px;
      top: 262px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.22em;
      color: __COULEUR__;
    }
    .name {
      position: absolute;
      left: 64px;
      top: 318px;
      width: 690px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 78px;
      line-height: 0.86;
      letter-spacing: 0.005em;
      color: #fff;
      text-transform: uppercase;
    }
    .meta {
      position: absolute;
      left: 63px;
      right: 49px;
      top: 552px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .kicker {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #B2AEA7;
    }
    .season {
      margin-top: 10px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .num-block { text-align: right; }
    .num {
      margin-top: 14px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: __COULEUR__;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <div class="rule"></div>
    <div class="foot"></div>
    <img class="logo" alt="" src="__LOGO__" />
    <div class="brand"><span class="vol">__NOM_COURT__</span></div>
    <div class="sub">__SOUS_TITRE__</div>
    <div class="role">ADHÉRENT</div>
    <div class="name" id="name" data-prenom="__PRENOM__" data-nom="__NOM__">__LIGNE__</div>
    <div class="meta">
      <div>
        <div class="kicker">SAISON</div>
        <div class="season">__SAISON__</div>
      </div>
      <div class="num-block">
        <div class="kicker">N° ADHÉRENT</div>
        <div class="num">__NUMERO__</div>
      </div>
    </div>
  </div>
  <script>
    window.fitName = function () {
      const el = document.getElementById("name");
      const max = 690;
      const min = 42;
      let size = 78;
      el.style.whiteSpace = "nowrap";
      el.style.fontSize = size + "px";
      while (el.scrollWidth > max && size > min) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
      if (el.scrollWidth <= max) return;
      const prenom = el.dataset.prenom || "";
      const nom = el.dataset.nom || "";
      el.textContent = "";
      el.style.whiteSpace = "normal";
      el.style.fontSize = "58px";
      el.style.lineHeight = "0.88";
      const a = document.createElement("div");
      a.textContent = prenom;
      const b = document.createElement("div");
      b.textContent = nom;
      el.append(a, b);
    };
  </script>
</body>
</html>
